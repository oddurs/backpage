name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # backpage targets macOS only; running it elsewhere would prove nothing.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install shellcheck
        run: command -v shellcheck || brew install shellcheck

      - run: scripts/task check

  # Single status check for branch protection: stays valid as jobs are added.
  required:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "check: ${{ needs.check.result }}"
            exit 1
          fi
